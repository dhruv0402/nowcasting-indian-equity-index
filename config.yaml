# Universal Institutional Multi-Asset Universe Configuration
tickers:
  # --- Benchmark Indices & GIFT City ---
  - "^NSEI"          # NIFTY 50 (National Stock Exchange)
  - "^BSESN"         # S&P BSE SENSEX 30
  - "^NSEBANK"       # NIFTY BANK Index
  - "^CNXIT"         # NIFTY IT Index
  - "INDA"           # iShares MSCI India ETF (GIFT / Global India Proxy)

  # --- Indian Mega-Caps ---
  - "RELIANCE.NS"    # Reliance Industries
  - "TCS.NS"         # Tata Consultancy Services
  - "HDFCBANK.NS"    # HDFC Bank
  - "ICICIBANK.NS"   # ICICI Bank
  - "INFY.NS"        # Infosys
  - "SBIN.NS"        # State Bank of India
  - "ITC.NS"         # ITC Limited

  # --- Indian Mid-Caps & Growth Leaders ---
  - "POLYCAB.NS"     # Polycab India (Wires & Cables / Infra)
  - "KPITTECH.NS"    # KPIT Technologies (Automotive Software)
  - "TATAELXSI.NS"   # Tata Elxsi (Design & Tech)
  - "JIOFIN.NS"      # Jio Financial Services (Fintech / NBFC)

  # --- Indian Small-Caps & High-Beta Momentum ---
  - "SUZLON.NS"      # Suzlon Energy (Green Energy / Wind)
  - "IREDA.NS"       # Indian Renewable Energy Dev Agency (PSU Solar/Wind)
  - "RVNL.NS"        # Rail Vikas Nigam Ltd (Rail Infrastructure)
  - "KAYNES.NS"      # Kaynes Technology (EMS / Semiconductors)

  # --- MCX Commodities & Derivatives ---
  - "MCX.NS"         # Multi Commodity Exchange of India Ltd
  - "GC=F"           # MCX / COMEX Gold Futures
  - "SI=F"           # MCX / COMEX Silver Futures
  - "CL=F"           # MCX / NYMEX WTI Crude Oil
  - "NG=F"           # MCX Natural Gas
  - "HG=F"           # MCX Copper Futures

  # --- US Benchmark Indices & Tech Giants (Magnificent 7) ---
  - "^GSPC"          # S&P 500 Benchmark Index
  - "^IXIC"          # NASDAQ Composite
  - "NVDA"           # NVIDIA Corporation (AI Computing)
  - "AAPL"           # Apple Inc
  - "MSFT"           # Microsoft Corporation
  - "GOOGL"          # Alphabet / Google
  - "AMZN"           # Amazon.com
  - "META"           # Meta Platforms
  - "TSLA"           # Tesla

  # --- 24/7 Digital Assets & Crypto ---
  - "BTC-USD"        # Bitcoin
  - "ETH-USD"        # Ethereum
  - "SOL-USD"        # Solana

asset_classes:
  gift_and_indian_indices:
    name: "GIFT Nifty & Benchmark Indices"
    tickers: ["^NSEI", "^BSESN", "^NSEBANK", "^CNXIT", "INDA"]
    market_hours: "NSE"
  indian_mega_caps:
    name: "Indian Large-Caps"
    tickers: ["RELIANCE.NS", "TCS.NS", "HDFCBANK.NS", "ICICIBANK.NS", "INFY.NS", "SBIN.NS", "ITC.NS"]
    market_hours: "NSE"
  indian_mid_caps:
    name: "Indian Mid-Caps"
    tickers: ["POLYCAB.NS", "KPITTECH.NS", "TATAELXSI.NS", "JIOFIN.NS"]
    market_hours: "NSE"
  indian_small_and_micro:
    name: "Indian Small & Micro-Caps"
    tickers: ["SUZLON.NS", "IREDA.NS", "RVNL.NS", "KAYNES.NS"]
    market_hours: "NSE"
  mcx_commodities:
    name: "MCX Commodities & Exchange"
    tickers: ["MCX.NS", "GC=F", "SI=F", "CL=F", "NG=F", "HG=F"]
    market_hours: "GLOBAL"
  us_indices_and_tech:
    name: "US Benchmarks & Mag-7 Tech"
    tickers: ["^GSPC", "^IXIC", "NVDA", "AAPL", "MSFT", "GOOGL", "AMZN", "META", "TSLA"]
    market_hours: "US"
  crypto:
    name: "24/7 Digital Assets"
    tickers: ["BTC-USD", "ETH-USD", "SOL-USD"]
    market_hours: "24/7"

data_collection:
  mode: "rolling"
  min_collection_days: 21
  rss_feeds:
    # --- Indian Financial & Macro Feeds ---
    - name: "Economic Times Markets"
      url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
    - name: "Economic Times Stocks"
      url: "https://economictimes.indiatimes.com/markets/stocks/rssfeeds/2146842.cms"
    - name: "Economic Times Economy"
      url: "https://economictimes.indiatimes.com/news/economy/rssfeeds/1373380680.cms"
    - name: "Livemint Markets"
      url: "https://www.livemint.com/rss/markets"
    - name: "Moneycontrol Top News"
      url: "https://www.moneycontrol.com/rss/MCtopnews.xml"
    - name: "Google News Nifty Sensex"
      url: "https://news.google.com/rss/search?q=nifty+sensex+stock+market+india&hl=en-IN&gl=IN&ceid=IN:en"
    # --- US & Global Tech / Macro Feeds ---
    - name: "CNBC Top Markets"
      url: "https://search.cnbc.com/rs/search/view.html?partnerId=2000&keywords=markets&sort=date"
    - name: "Google News US Markets"
      url: "https://news.google.com/rss/search?q=wall+street+fed+nvidia+apple+sp500&hl=en-US&gl=US&ceid=US:en"
    # --- Crypto & Digital Assets Feeds ---
    - name: "CoinDesk Latest"
      url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    - name: "CoinTelegraph News"
      url: "https://cointelegraph.com/rss"
    # --- Commodities & Energy Feeds ---
    - name: "OilPrice Energy News"
      url: "https://oilprice.com/rss/main"

lag_detection:
  baseline_window_min: 15
  reaction_window_min: 60
  significance_std_threshold: 2.0

backtest:
  slippage_bps: 5.0
  brokerage_flat_fee_inr: 20.0
  monte_carlo_simulations: 1000

model:
  algo: "xgboost"
  train_test_split: "time_based_80_20"
  random_state: 42

paths:
  db_path: "data/db.sqlite"
  raw_dir: "data/raw"
