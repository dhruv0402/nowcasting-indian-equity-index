name: 24/7 Cloud Data Collector Daemon

on:
  schedule:
    # Run every 5 minutes 24/7 in the cloud to accelerate headline ingestion
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions UI

jobs:
  collect-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary pg8000 python-dotenv

      - name: Execute Cloud Collection Cycle
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 src/ingestion/collector_daemon.py --once
