name: Daily Automated Model Evaluator & Trainer

on:
  schedule:
    # Run once daily at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions UI

jobs:
  evaluate-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary pg8000 python-dotenv

      - name: Execute Daily Model Evaluation Cycle
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 run_pipeline.py --stage lag
          python3 run_pipeline.py --stage features
          python3 run_pipeline.py --stage train
