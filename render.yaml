services:
  - type: web
    name: pulse-nowcast-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m uvicorn src.backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SUPABASE_DB_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
